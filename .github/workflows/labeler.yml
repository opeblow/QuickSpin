name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Auto-label PRs
    runs-on: ubuntu-latest
    steps:
      - name: Labeler
        uses: github/labeler@v5
        with:
          sync-labels: true