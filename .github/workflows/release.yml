name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Verify and create GitHub release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify SDK
        run: npm run check

      - name: Build demo
        run: npm run build

      - name: Package SDK and demo artifacts
        run: |
          test -d dist
          test -d dist-demo
          tar -czf quickspin-sdk-dist.tar.gz -C dist .
          tar -czf quickspin-demo-dist.tar.gz -C dist-demo .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            quickspin-sdk-dist.tar.gz
            quickspin-demo-dist.tar.gz
          generate_release_notes: true
